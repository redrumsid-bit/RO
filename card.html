<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ffffff">
<title>김정현 · RO | 모바일 명함</title>
<meta name="description" content="알오(RO) 대표 김정현의 모바일 명함. contact@roon.kr · roon.kr">
<link rel="canonical" href="https://roon.kr/card.html">
<meta property="og:type" content="website">
<meta property="og:title" content="김정현 · RO Software Engineering">
<meta property="og:description" content="알오(RO) 대표 김정현 | contact@roon.kr | 연락처 저장 및 문의">
<meta property="og:url" content="https://roon.kr/card.html">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="card.css?v=20261111-a">
<script src="card.js?v=20261111" defer></script>
</head>
<body>
<main class="shell">
  <article class="card" aria-label="알오 대표 김정현 모바일 명함">
    <header class="brand">
      <img src="assets/card-logo.svg?v=20261111-navy" width="125" height="62" alt="RO">
      <p>Software Engineering</p>
    </header>
    <div class="identity">
      <h1><span>대표</span> 김정현</h1>
      <p class="company">알오 RO</p>
      <nav class="contacts" aria-label="연락처">
        <a href="mailto:contact@roon.kr"><span>contact@roon.kr</span><span class="arrow" aria-hidden="true">↗</span></a>
        <a href="index.html"><span>roon.kr</span><span class="arrow" aria-hidden="true">↗</span></a>
      </nav>
    </div>
    <a class="primary" href="ro-kim-junghyun.vcf" download="RO-김정현.vcf">연락처 저장</a>
    <section class="share" aria-label="명함 전달">
      <details class="qr-panel">
        <summary><span class="when-closed">QR 보기</span><span class="when-open">QR 닫기</span><span class="toggle-mark" aria-hidden="true"></span></summary>
        <div class="qr-content">
          <img src="assets/ro-card-qr.svg" width="184" height="184" alt="https://roon.kr/card.html로 연결되는 QR 코드">
          <p>스캔하면 이 명함이 열립니다.</p>
          <a class="qr-download" href="assets/ro-card-qr.svg" download="RO-모바일명함-QR.svg">QR 저장</a>
        </div>
      </details>
      <button id="share-card" type="button" hidden>링크 공유</button>
      <p class="status" id="share-status" role="status" aria-live="polite"></p>
    </section>
  </article>
</main>
</body>
</html>
