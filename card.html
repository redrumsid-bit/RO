<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#f2f1ef">
<title>김정현 · RO | 모바일 명함</title>
<meta name="description" content="알오(RO) 대표 김정현의 모바일 명함. contact@roon.kr · roon.kr">

<meta property="og:type" content="website">

<meta property="og:description" content="알오(RO) 대표 김정현 | contact@roon.kr | 연락처 저장 및 문의">
<meta property="og:url" content="https://roon.kr/card.html">

<link rel="stylesheet" href="card.css?v=20261111-wallet">

</head>
<body>
<main class="shell">
  <section class="card-stage" aria-label="모바일 명함">
    <div class="card-stack">
      <article class="business-card" aria-label="알오 대표 김정현">
        <header class="brand">
          <img src="assets/card-logo.svg?v=20261111-navy" width="125" height="62" alt="RO">
          <p>Software Engineering</p>
        </header>
        <div class="card-details">
          <h1><span>대표</span> 김정현</h1>
          <nav class="contacts" aria-label="연락처">
            <a href="mailto:contact@roon.kr">contact@roon.kr</a>
            <a href="index.html">roon.kr</a>
          </nav>
        </div>
      </article>
    </div>
  </section>
  <section class="actions" aria-label="명함 저장 및 전달">
    <a class="primary" href="ro-kim-junghyun.vcf" download="RO-김정현.vcf"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span>연락처 저장</span></a>
    <div class="share">
      <details class="qr-panel">
        <summary><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 12h8"/></svg><span class="when-closed">QR 보기</span><span class="when-open">QR 닫기</span></summary>
        <div class="qr-content">
          <img src="assets/ro-card-qr.svg" width="184" height="184" alt="https://roon.kr/card.html로 연결되는 QR 코드">
          <p>스캔하면 이 명함이 열립니다.</p>
          <a class="qr-download" href="assets/ro-card-qr.svg" download="RO-모바일명함-QR.svg">QR 저장</a>
        </div>
      </details>
      <button id="share-card" type="button" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7 3-3a5 5 0 0 1 7 7l-3 3m-3 3-3 3a5 5 0 0 1-7-7l3-3m1 6 8-8"/></svg><span>링크 공유</span></button>
      <p class="status" id="share-status" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>
</body>
</html>
